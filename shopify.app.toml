# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d17227215824c8a4d33087ec24a42d70"
name = "CartMend"
application_url = "https://cart-mend.vercel.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/create"
  topics = [ "orders/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/updated"
  topics = [ "orders/updated" ]

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders,read_products,write_products,read_customers,write_customers,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,read_order_edits,write_order_edits"

[auth]
redirect_urls = [
  "https://cart-mend.vercel.app/api/auth",
  "https://cart-mend.vercel.app/auth/callback",
  "https://cart-mend.vercel.app/auth/shopify/callback"
]

[app_proxy]
url = "https://cart-mend.vercel.app/apps/cartmend"
subpath = "cartmend"
prefix = "apps"
